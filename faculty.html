<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="dashboard-header">
        <div>
            <h2>📚 Cloud Attendance</h2>
            <p>Faculty Dashboard</p>
        </div>
        <button type="button" class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main class="dashboard">

        <h1>Welcome, Faculty!</h1>
        <p class="dashboard-subtitle">
            Manage student attendance in one place.
        </p>

        <section class="stats-grid">

            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Present Today</h3>
                <p id="presentStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Absent Today</h3>
                <p id="absentStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Attendance</h3>
                <p id="attendancePercentage">0%</p>
            </div>

        </section>

        <section class="action-section">
            <h2>Quick Actions</h2>

            <div class="action-grid">
                <button onclick="openAttendance()">
                    📝 Mark Attendance
                </button>

                <button onclick="openStudents()">
                    👥 Manage Students
                </button>
            </div>
        </section>

        <section class="recent-section">
            <h2>Today's Attendance</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTable">
                        <tr>
                            <td colspan="3">No attendance records yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        function openAttendance() {
            window.location.href = "attendance.html";
        }

        function openStudents() {
            window.location.href = "students.html";
        }

        function logout() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
